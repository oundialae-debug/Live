name: bajar-musica
on:
  push:
    paths: ["descargas/*.json"]
permissions:
  contents: write
jobs:
  bajar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Descargar pistas
        run: |
          mkdir -p musica
          for f in descargas/*.json; do
            for n in $(jq -r '.files | keys[]' "$f"); do
              u=$(jq -r --arg n "$n" '.files[$n]' "$f")
              curl -sfL -o "musica/$n" "$u" && echo "OK $n $(stat -c%s musica/$n)" || echo "FALLO $n"
            done
          done
          rm -f descargas/*.json
      - name: Guardar
        run: |
          git config user.name "2yellow-bot"; git config user.email "bot@users.noreply.github.com"
          git add -A musica descargas; git diff --cached --quiet || git commit -m "musica: pistas descargadas [skip ci]"
          git push
