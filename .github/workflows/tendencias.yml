name: tendencias
# Búsquedas de fútbol en tendencia (Google Trends RSS) antes de la tarea diaria (07:46 Madrid) y a media tarde.
on:
  schedule: [{cron: "20 5 * * *"}, {cron: "0 14 * * *"}]
  workflow_dispatch:
permissions:
  contents: write
concurrency: {group: tendencias}
jobs:
  tendencias:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/tendencias.py
      - name: Guardar
        run: |
          git config user.name "2yellow-bot"; git config user.email "bot@users.noreply.github.com"
          git add redes/tendencias.md; git diff --cached --quiet && exit 0
          git commit -m "tendencias: actualizadas [skip ci]"
          for i in 1 2 3; do git pull --rebase -q && git push && break; sleep 5; done
