name: montar-video
on:
  push:
    paths: ["pedidos/*.json"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  montar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 2}
      - name: ffmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - name: Montar pedidos nuevos
        run: |
          ficheros=$(git diff --name-only --diff-filter=AM HEAD~1 HEAD -- 'pedidos/*.json' || true)
          [ -z "$ficheros" ] && ficheros=$(ls pedidos/*.json 2>/dev/null | tail -1)
          python3 scripts/montar_video.py $ficheros
      - name: Borrar vídeos de más de 14 días
        run: find videos -name '*.mp4' -mtime +14 -delete || true
      - name: Guardar
        run: |
          git config user.name "2yellow-bot"; git config user.email "bot@users.noreply.github.com"
          git add videos; git diff --cached --quiet || git commit -m "videos: montados [skip ci]"
          git push
